<mat-card
  style="
    max-width: 1100px;
    margin: 32px auto 0 auto;
    padding: 24px;
    border-radius: 12px;
  "
>
  <app-character-search
    (search)="onSearch($event)"
    (clear)="onClear()"
  ></app-character-search>
  <app-character-table
    [dataSource]="dataSource"
    [displayedColumns]="displayedColumns"
  ></app-character-table>
</mat-card>
