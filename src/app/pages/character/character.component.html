    (search)="onSearch($event)"
    (clear)="onClear()"
  ></app-character-search>
  <app-character-table

    [displayedColumns]="displayedColumns"
  ></app-character-table>
  <app-footer [dataSource]="dataSource"></app-footer>
</mat-card>
